name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build both editions
        shell: pwsh
        run: ./build.ps1

      - name: Pack release archives
        shell: pwsh
        run: |
          $version = (Get-Item 'dist/Kanban/Kanban.exe').VersionInfo.FileVersion.Split('.')[0..2] -join '.'
          New-Item -ItemType Directory 'dist/release' -Force | Out-Null
          Compress-Archive -Path 'dist/Kanban/*' -DestinationPath "dist/release/Kanban-$version-win-x64.zip" -CompressionLevel Optimal
          Compress-Archive -Path 'dist/Kanban-Basic/*' -DestinationPath "dist/release/Kanban-Basic-$version-win-x64.zip" -CompressionLevel Optimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kanban-portable
          path: dist/release/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*.zip
          generate_release_notes: true
